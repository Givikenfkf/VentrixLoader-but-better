name: Build Android (Bootstrap)

# Run on push to main/master or manually
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android Bootstrap (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # (Optional) Cache NuGet packages if your repository uses dotnet/nuget heavily
      - name: Setup NuGet cache
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj','**/packages.lock.json') }}
          restore-keys: |
            nuget-

      # Install .NET SDK (adjust version if your build needs different)
      - name: Setup .NET SDK 6.0
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '6.0.x'

      # Install Rust toolchain (if your bootstrap uses Rust components)
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      # (Optional) Setup Java (if Android SDK/gradle tools required by your scripts)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      # If your build script expects Android SDK/NDK installed, uncomment/adapt an installer below.
      # Many Windows runners already include Android SDK components, but if your script requires a specific NDK,
      # you can install it via sdkmanager or choco. Example (commented):
      #
      # - name: Install Android SDK tools (example; adapt if needed)
      #   shell: cmd
      #   run: |
      #     choco install -y android-sdk
      #     REM Example to accept licenses or install a specific NDK; adapt for your needs
      #     REM sdkmanager "ndk;21.4.7075529" --sdk_root="%ANDROID_SDK_ROOT%"

      # Run the repo's Windows batch build script using cmd (avoids PowerShell quoting issues)
      - name: Run Android bootstrap compile script (release)
        shell: cmd
        working-directory: ${{ github.workspace }}
        run: |
          echo Listing repo root to help debug paths...
          dir
          REM --- run the repo's Windows batch build script ---
          call .\compile_bootstrap_android.bat

      # (Optional) If you want a debug build instead, add another step using the debug script.
      # - name: Run Android bootstrap compile script (debug)
      #   shell: cmd
      #   run: |
      #     call .\compile_bootstrap_android_debug.bat

      # Collect and show likely outputs (uses cmd)
      - name: Collect possible build outputs
        shell: cmd
        run: |
          echo Looking for typical output locations...
          dir /s /b . | findstr /i "apk aab zip so dll exe lib bootstrap" || echo No obvious artifacts found yet.

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          # Try to upload the most likely output folders/files; adjust to the folder(s) your build actually creates
          name: android-build-artifacts
          path: |
            ./MelonLoader.Bootstrap/bin/Release/
            ./MelonLoader.Bootstrap/bin/Debug/
            ./build/
            ./out/
            ./*.zip
            ./*.apk
            ./*.aab
            ./**/*.so
            ./**/*.dll
            ./**/bootstrap*.*
