name: Build Android (Bootstrap)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '6.0.x'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Install Rust (optional)
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Run compile script (cmd)
        shell: cmd
        working-directory: ${{ github.workspace }}
        run: |
          echo Listing repo root to help debug paths...
          dir
          REM run build
          call .\compile_bootstrap_android.bat

      - name: Show Output folder contents
        shell: cmd
        run: |
          echo Listing top-level Output folder (if any)...
          dir /s /b Output || echo "No Output folder found"
          echo Listing MelonLoader.Bootstrap bin folders...
          dir /s /b MelonLoader.Bootstrap\bin || echo "No bootstrap bin folder found"

      - name: Create zip of Output folder (if exists)
        shell: pwsh
        run: |
          if (Test-Path -Path ./Output) {
            $zipPath = Join-Path $PWD 'artifacts-output.zip'
            if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
            Compress-Archive -Path ./Output -DestinationPath $zipPath -Force
            Write-Host "Created $zipPath"
          } else {
            Write-Host "No Output folder to zip"
          }

      - name: Upload build artifacts (Output + bootstrap)
        uses: actions/upload-artifact@v4
        with:
          name: android-build-artifacts
          path: |
            Output/**
            artifacts-output.zip
            MelonLoader.Bootstrap/bin/**
            MelonLoader.Bootstrap/bin/x86/** 
            MelonLoader.Bootstrap/bin/Release/**
            **/*.dll
            **/libmain.dll
            **/*.so
            **/*.apk
            **/*.aab
