name: Build Android (Bootstrap)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '6.0.x'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Install Rust (optional)
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Run compile script (cmd)
        shell: cmd
        working-directory: ${{ github.workspace }}
        run: |
          echo === Running compile_bootstrap_android.bat ===
          call .\compile_bootstrap_android.bat
          echo === compile script finished ===

      - name: List Output folder contents (if any)
        shell: cmd
        run: |
          if exist Output (
            echo Listing Output\...
            dir /s /b Output
          ) else (
            echo "No Output folder found"
          )

      - name: List bootstrap bin folders (if any)
        shell: cmd
        run: |
          if exist MelonLoader.Bootstrap\bin (
            echo Listing MelonLoader.Bootstrap\bin\...
            dir /s /b MelonLoader.Bootstrap\bin
          ) else (
            echo "No MelonLoader.Bootstrap\bin folder found"
          )

      - name: Create zip of Output folder (or placeholder)
        shell: pwsh
        run: |
          if (Test-Path -Path ./Output) {
            $zipPath = Join-Path $PWD 'artifacts-output.zip'
            if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
            Compress-Archive -Path ./Output -DestinationPath $zipPath -Force
            Write-Host "Created $zipPath"
          } else {
            Write-Host "No Output folder to zip; creating placeholder no_artifacts.txt"
            "No artifacts produced by build" | Out-File -FilePath no_artifacts.txt -Encoding UTF8
          }

      - name: Upload build artifacts (Output + common patterns)
        uses: actions/upload-artifact@v4
        with:
          name: android-build-artifacts
          path: |
            artifacts-output.zip
            no_artifacts.txt
            Output/**
            MelonLoader.Bootstrap/bin/**
            **/bin/**/Release/**
            **/Output/**/*
            **/*.dll
            **/*.so
            **/*.apk
            **/*.aab
