name: Build VentrixLoader (Windows)

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Setup Java (required for sdkmanager)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Prepare Android SDK root
        shell: pwsh
        run: |
          $sdkroot = "C:\android-sdk"
          New-Item -ItemType Directory -Force -Path $sdkroot | Out-Null
          setx ANDROID_SDK_ROOT $sdkroot
          # download commandline tools (version may change); GitHub runner has internet
          $zip = "$PWD\cmdline.zip"
          Invoke-WebRequest -Uri "https://dl.google.com/android/repository/commandlinetools-win-9477386_latest.zip" -OutFile $zip
          Expand-Archive $zip -DestinationPath "$sdkroot\cmdline-tools" -Force
          # move into 'latest' folder (sdkmanager expects cmdline-tools\bin under a folder name)
          New-Item -ItemType Directory -Force -Path "$sdkroot\cmdline-tools\latest" | Out-Null
          Move-Item -Path "$sdkroot\cmdline-tools\cmdline-tools\*" -Destination "$sdkroot\cmdline-tools\latest\"
          Remove-Item $zip -Force

      - name: Install Android SDK components (platform-tools, build-tools, NDK)
        shell: pwsh
        env:
          ANDROID_SDK_ROOT: C:\android-sdk
        run: |
          $env:PATH = "$env:PATH;C:\android-sdk\cmdline-tools\latest\bin;C:\android-sdk\platform-tools"
          # Accept licenses and install required components (adjust versions if your script needs a different NDK)
          sdkmanager.bat --sdk_root=%ANDROID_SDK_ROOT% "platform-tools" "platforms;android-33" "build-tools;33.0.2" "ndk;25.2.9519653" --licenses || true
          sdkmanager.bat --sdk_root=%ANDROID_SDK_ROOT% "platform-tools" "platforms;android-33" "build-tools;33.0.2" "ndk;25.2.9519653"

      - name: Show environment checks
        shell: pwsh
        run: |
          dotnet --info
          java -version
          where sdkmanager || true
          where ndk-build || true
          where msbuild || true

      - name: Run the repository build script
        shell: pwsh
        run: |
          # change this if your bat has a different name
          if (Test-Path -Path "./compile_bootstrap_android.bat") {
            cmd /c compile_bootstrap_android.bat
          } elseif (Test-Path -Path "./build.bat") {
            cmd /c build.bat
          } else {
            Write-Error "No known .bat found. Update the workflow with the correct script name."
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ventrix-build
          path: |
            build/
            bin/
            output/
            **/*.so
            **/*.apk
